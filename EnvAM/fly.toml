# fly.toml app configuration file generated for envam on 2025-09-15T23:53:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'envam'
primary_region = 'atl'
console_command = '/code/manage.py shell'

[build]

[env]
  PORT = '8000'
  ALLOWED_HOSTS = "envam.fly.dev,localhost,127.0.0.1,0.0.0.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
